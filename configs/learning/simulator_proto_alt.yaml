# Robustness setting for evaluation only (no policy is trained on it). Derived from simulator_proto_v2.yaml.
# Every value is an assumption, not an empirically calibrated effect. Changes from v2 are marked "alt:".
action_effect:
  PROBE: 0
  CHECK_MASTERY: 0
  PRACTICE: 0.5
  HINT: {incorrect: 0.6, otherwise: 0.15}
  EXPLAIN_CONCEPT: {below_0_4: 0.7, from_0_4_to_0_75: 0.4, above_0_75: 0.1}
  WORKED_EXAMPLE: {below_0_4: 0.8, from_0_4_to_0_75: 0.5, above_0_75: 0.1}
  CHALLENGE: {at_least_0_6: 0.6, below_0_6: 0.1}
  REFLECT: {previous_and_incorrect: 0.4, otherwise: 0.2}
readiness:
  prerequisite_factor: "0.5 + 0.5 * min(prerequisite_mastery)"
  difficulty_fit:
    easy: {below_0_5: 1.0, otherwise: 0.7}
    medium: 0.9
    hard: {at_least_0_6: 1.0, otherwise: 0.4}
novelty: "0.6 ** preceding_identical_moves_on_same_concept"
content_fidelity:
  stub_realized: 1.0
  failure_probability: 0.0
misconceptions:
  # alt: misconception drives a wrong answer less often (0.7 -> 0.6).
  susceptible_incorrect_probability: 0.6
  surfaced_by: [PROBE, REFLECT]
  # alt: probing is worth less (surfaced 0.5 -> 0.35) and unprobed teaching worth more (0.1 -> 0.15).
  deactivate_probability: {surfaced: 0.35, not_surfaced: 0.15}
dropout:
  # Assumption: lowered from v1's 0.01 because 50 of 62 dropouts in 200 train rules episodes came from the flat base hazard rather than tutor behavior (incorrect streak 4, pace mismatch 8); not empirically calibrated.
  base_per_turn: 0.004
  per_independent_incorrect_after_two: 0.02
  per_pace_mismatch_turn: 0.02
help_seeking:
  request: hint
  profiles_use_probability: true
profiles:
  novice_missing_prereqs:
    # alt: prerequisite mastery range shifted (0.05-0.35 -> 0.10-0.40); learning rates halved.
    concept_mastery: [0.10, 0.40]
    ell: [0.03, 0.06]
    help_seeking_probability: 0.3
    preferred_pace: normal
  knowledgeable_concise:
    # alt: ranges shifted down (0.7-0.9 -> 0.6-0.85, goal 0.5-0.7 -> 0.4-0.6); learning rates halved.
    concept_mastery: [0.6, 0.85]
    goal_mastery: [0.4, 0.6]
    ell: [0.02, 0.05]
    help_seeking_probability: 0.05
    preferred_pace: concise
  confident_misconception:
    # alt: range shifted down (0.4-0.6 -> 0.3-0.55); learning rates halved.
    concept_mastery: [0.3, 0.55]
    active_misconception: M05
    susceptible_concepts: [C06, C08]
    ell: [0.02, 0.05]
    help_seeking_probability: 0.05
    preferred_pace: normal
observation:
  item_format: free_response
  # alt: guess and slip shifted up (guess 0-0.05 -> 0.05-0.15, slip 0.02-0.20 -> 0.05-0.25).
  guess: [0.05, 0.15]
  slip: [0.05, 0.25]
  difficulty_factor: {easy: 1.0, medium: 0.85, hard: 0.65}
  forgetting: 0.0
