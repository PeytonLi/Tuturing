  # Local llama.cpp (Apple M4, 16 GB). Free. Not run in v1: Xueming asked for no new local
  # downloads on 2026-11-02. Start one server at a time with server_command, then run.
  - id: qwen3.5-9b-q4km-local
    enabled: false
    disabled_reason: no new local downloads (Xueming, 2026-11-02)
    label: Qwen3.5-9B Q4_K_M, local llama.cpp (Qwen3.8 architecture family proxy)
    provider: openai_compatible
    base_url: http://127.0.0.1:8089/v1
    model: qwen3.5-9b
    concurrency: 1
    timeout_s: 300
    decoding:
      temperature: 0
      max_tokens: 384
      extra: {chat_template_kwargs: {enable_thinking: false}}
    reasoning: {setting: enable_thinking=false via chat_template_kwargs}
    pricing: {basis: free}
    weights:
      repo: unsloth/Qwen3.5-9B-GGUF
      file: Qwen3.5-9B-Q4_K_M.gguf
      revision: 3885219b6810b007914f3a7950a8d1b469d598a5
      size_gb: 5.68
      license: apache-2.0 (base Qwen/Qwen3.5-9B, model_type qwen3_5 like Qwen3.8-27B)
    server_command: >-
      llama-server -m ~/models/Qwen3.5-9B-Q4_K_M.gguf --host 127.0.0.1 --port 8089
      -c 4096 --jinja --alias qwen3.5-9b
