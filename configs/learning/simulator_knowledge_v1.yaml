    - 0.7
    - 0.85
    active_misconception: M05
    susceptible_concepts:
    - C06
    - C08
    ell:
    - 0.04
    - 0.1
    help_seeking_probability: 0.02
    preferred_pace: normal
observation:
  item_format: free_response
  guess:
  - 0.0
  - 0.05
  slip:
  - 0.02
  - 0.2
  difficulty_factor:
    easy: 1.0
    medium: 0.85
    hard: 0.65
  forgetting: 0.0
pace_cues:
  strength: 1.0
  mismatch_weight: 0.5
  reply_seconds:
    median: 14.0
    sigma: 0.55
    log_shift: 0.35
  message_words:
    mean: 6.0
    log_shift: 0.4
    skim_max_words: 2
  skim:
    base_logit: -1.6
    slope: 0.9
  confusion:
    base_logit: -2.0
    slope: 0.8
  why_question:
    base_logit: -2.2
    slope: 0.8
