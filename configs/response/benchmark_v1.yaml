    concurrency: 4
    decoding: {temperature: 0, max_tokens: 384, extra: {reasoning_effort: none}}
    reasoning: {setting: reasoning_effort=none, note: unverified for this model}
    pricing:
      basis: tokens
      input_usd_per_mtok: 2.00
      cached_input_usd_per_mtok: 0.25
      output_usd_per_mtok: 6.00
      source: https://docs.fireworks.ai/serverless/pricing.md
