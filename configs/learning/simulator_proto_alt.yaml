# robustness-only alternate assumptions, never used for training or checkpoint selection
# Per-move action effects are halved; learner ell ranges stay fixed to avoid halving twice.
action_effect:
  PROBE: 0
  CHECK_MASTERY: 0
  PRACTICE: 0.25
  HINT: {incorrect: 0.3, otherwise: 0.075}
  EXPLAIN_CONCEPT: {below_0_4: 0.35, from_0_4_to_0_75: 0.2, above_0_75: 0.05}
  WORKED_EXAMPLE: {below_0_4: 0.4, from_0_4_to_0_75: 0.25, above_0_75: 0.05}
  CHALLENGE: {at_least_0_6: 0.3, below_0_6: 0.05}
  REFLECT: {previous_and_incorrect: 0.2, otherwise: 0.1}
readiness:
  prerequisite_factor: "0.5 + 0.5 * min(prerequisite_mastery)"
  difficulty_fit:
    easy: {below_0_5: 1.0, otherwise: 0.7}
    medium: 0.9
    hard: {at_least_0_6: 1.0, otherwise: 0.4}
novelty: "0.6 ** preceding_identical_moves_on_same_concept"
content_fidelity:
  stub_realized: 1.0
  failure_probability: 0.0
misconceptions:
  susceptible_incorrect_probability: 0.7
  surfaced_by: [PROBE, REFLECT]
  deactivate_probability: {surfaced: 0.5, not_surfaced: 0.1}
dropout:
  # Assumption: lowered from v1's 0.01 because 50 of 62 dropouts in 200 train rules episodes came from the flat base hazard rather than tutor behavior (incorrect streak 4, pace mismatch 8); not empirically calibrated.
  base_per_turn: 0.004
  per_independent_incorrect_after_two: 0.02
  per_pace_mismatch_turn: 0.02
help_seeking:
  request: hint
  profiles_use_probability: true
profiles:
  novice_missing_prereqs:
    concept_mastery: [0.05, 0.25]
    ell: [0.06, 0.12]
    help_seeking_probability: 0.3
    preferred_pace: normal
  knowledgeable_concise:
    concept_mastery: [0.6, 0.8]
    goal_mastery: [0.4, 0.6]
    ell: [0.04, 0.10]
    help_seeking_probability: 0.05
    preferred_pace: concise
  confident_misconception:
    concept_mastery: [0.3, 0.5]
    active_misconception: M05
    susceptible_concepts: [C06, C08]
    ell: [0.04, 0.10]
    help_seeking_probability: 0.05
    preferred_pace: normal
observation:
  item_format: free_response
  guess: [0.05, 0.10]
  slip: [0.07, 0.25]
  difficulty_factor: {easy: 1.0, medium: 0.85, hard: 0.65}
  forgetting: 0.0
