# Copy of simulator_proto_v2 with test-only profiles; every learner prefers normal pace.
action_effect:
  PROBE: 0
  CHECK_MASTERY: 0
  PRACTICE: 0.5
  HINT:
    incorrect: 0.6
    otherwise: 0.15
  EXPLAIN_CONCEPT:
    below_0_4: 0.7
    from_0_4_to_0_75: 0.4
    above_0_75: 0.1
  WORKED_EXAMPLE:
    below_0_4: 0.8
    from_0_4_to_0_75: 0.5
    above_0_75: 0.1
  CHALLENGE:
    at_least_0_6: 0.6
    below_0_6: 0.1
  REFLECT:
    previous_and_incorrect: 0.4
    otherwise: 0.2
readiness:
  prerequisite_factor: 0.5 + 0.5 * min(prerequisite_mastery)
  difficulty_fit:
    easy:
      below_0_5: 1.0
      otherwise: 0.7
    medium: 0.9
    hard:
      at_least_0_6: 1.0
      otherwise: 0.4
novelty: 0.6 ** preceding_identical_moves_on_same_concept
content_fidelity:
  stub_realized: 1.0
  failure_probability: 0.0
misconceptions:
  susceptible_incorrect_probability: 0.7
  surfaced_by:
  - PROBE
  - REFLECT
  deactivate_probability:
    surfaced: 0.5
    not_surfaced: 0.1
dropout:
  base_per_turn: 0.004
  per_independent_incorrect_after_two: 0.02
  per_pace_mismatch_turn: 0.02
help_seeking:
  request: hint
  profiles_use_probability: true
  detailed_too_concise_bonus: 0.1
profiles:
  k_missing_basics:
    concept_mastery:
    - 0.05
    - 0.3
    weak_prerequisites_of_start: true
    ell:
    - 0.06
    - 0.12
    help_seeking_probability: 0.2
    preferred_pace: normal
  k_already_knows:
    concept_mastery:
    - 0.8
    - 0.95
    goal_mastery:
    - 0.8
    - 0.95
    ell:
    - 0.04
    - 0.1
    help_seeking_probability: 0.02
    preferred_pace: normal
  k_reverses_conditionals:
    concept_mastery:
    - 0.4
    - 0.6
    active_misconception: M05
    susceptible_concepts:
    - C06
    - C08
    ell:
    - 0.04
    - 0.1
    help_seeking_probability: 0.05
    preferred_pace: normal
  k_wrong_denominator:
    concept_mastery:
    - 0.4
    - 0.6
    active_misconception: M06
    susceptible_concepts:
    - C06
    ell:
    - 0.04
    - 0.1
    help_seeking_probability: 0.05
    preferred_pace: normal
  k_assumes_independence:
    concept_mastery:
    - 0.4
    - 0.6
    active_misconception: M07
    susceptible_concepts:
    - C08
    ell:
    - 0.04
    - 0.1
    help_seeking_probability: 0.05
    preferred_pace: normal
  k_tree_paths:
    concept_mastery:
    - 0.4
    - 0.6
    active_misconception: M08
    susceptible_concepts:
    - C08
    ell:
    - 0.04
    - 0.1
    help_seeking_probability: 0.05
    preferred_pace: normal
  k_complement_slip:
    concept_mastery:
    - 0.4
    - 0.6
    active_misconception: M04
    susceptible_concepts:
    - C03
    ell:
    - 0.04
    - 0.1
    help_seeking_probability: 0.05
    preferred_pace: normal
  k_event_vs_outcome:
    concept_mastery:
    - 0.3
    - 0.5
    active_misconception: M02
    susceptible_concepts:
    - C01
    - C02
    ell:
    - 0.04
    - 0.1
    help_seeking_probability: 0.1
    preferred_pace: normal
  k_strong_but_reverses:
