# Response service, prompt-only model profile: any OpenAI-compatible chat-completions server
# (a local llama.cpp llama-server, vLLM, or a hosted provider) behind the verified pipeline.
# This config names environment variables only; it holds no URL, model name or key.
#
#   export TUTOR_LLM_BASE_URL=https://api.fireworks.ai/inference/v1   # or a local server
#   export TUTOR_LLM_MODEL=accounts/<account>/deployments/<id>         # what the server expects
#   export TUTOR_LLM_API_KEY=...                                       # omit for a local server
#   export TUTOR_RESPONSE_SERVICE_TOKEN=...                            # this service's token
#   uv run python -m tools.response.serve --config configs/response/serve_openai_compatible.yaml
#
# The decoding block reproduces the request body benchmark_v1 used for Qwen3.8-27B on a
# Fireworks deployment: greedy (temperature 0), max_tokens, and reasoning_effort none, which
# Fireworks maps to enable_thinking=false. For a server that rejects reasoning_effort, delete
# that line; a rejection is logged as a responder config error, never a silent fallback. For
# gpt-6.1-sol use serve_gpt61sol.yaml. Every reply is buffered and checked before delivery;
# a reply that leaks a protected answer is replaced by the verified fallback. A frozen
# release must pin the model under a distinct artifact id.
schema_version: 1
service:
  host: 127.0.0.1
  port: 8081
  auth:
    token_env: TUTOR_RESPONSE_SERVICE_TOKEN
    allow_unauthenticated_loopback: false
  max_request_bytes: 262144
  max_concurrent: 4
  idempotency_cache_size: 1024
artifact:
  id: prompt_only_openai_compatible_v1
  compatible_ids: []
responder:
  kind: openai_compatible
  base_url_env: TUTOR_LLM_BASE_URL
  model_env: TUTOR_LLM_MODEL
  api_key_env: TUTOR_LLM_API_KEY
  api_key_required: false        # unset variable: no Authorization header (local server)
  request_timeout_s: 8
  decoding:
    token_param: max_tokens
    temperature: 0               # greedy decoding (PRD 14.1)
    reasoning_effort: none       # Fireworks Qwen3.8: thinking off, as in benchmark_v1
generation:
  internal_deadline_ms: 8000
  max_output_tokens: 384
  max_repairs: 1
versions:
  prompt: prompt_v1
  validator: validator_v2
  fallback: fallback_v1
