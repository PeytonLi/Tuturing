# Hidden-knowledge test set, from tools/dev/generate_knowledge_scenarios.py.
schema_version: scenarios_v1
learner_types:
- scenario_id: knowledge-01
  learner_type: missing_basics
  hidden_knowledge: Starts on conditional probability but never learned sample spaces
    and basic probability.
  adaptive_behavior: Notice repeated failure despite hints, drop difficulty, explain
    or show a worked example.
- scenario_id: knowledge-02
  learner_type: already_knows
  hidden_knowledge: Already knows the goal topic.
  adaptive_behavior: Check mastery or challenge quickly; do not spend turns re-teaching.
- scenario_id: knowledge-03
  learner_type: reverses_conditionals
  hidden_knowledge: Confidently computes P(B|A) when asked for P(A|B).
  adaptive_behavior: Probe to surface the wrong idea, then target it with a worked
    example or explanation.
- scenario_id: knowledge-04
  learner_type: wrong_denominator
  hidden_knowledge: Divides by the whole population instead of the conditioning event.
  adaptive_behavior: Probe, then target the denominator error.
- scenario_id: knowledge-05
  learner_type: assumes_independence
  hidden_knowledge: Multiplies plain probabilities on trees, as if events were independent.
  adaptive_behavior: Probe, then target the independence assumption.
- scenario_id: knowledge-06
  learner_type: tree_paths
  hidden_knowledge: Multiplies along branches that do not form one path.
  adaptive_behavior: Probe, then target the tree-path error.
- scenario_id: knowledge-07
  learner_type: complement_slip
  hidden_knowledge: Subtracts the wrong complement.
  adaptive_behavior: Probe, then target the complement error.
- scenario_id: knowledge-08
  learner_type: event_vs_outcome
  hidden_knowledge: Treats an event as a single outcome.
  adaptive_behavior: Probe, then target the event and outcome confusion.
- scenario_id: knowledge-09
  learner_type: strong_but_reverses
  hidden_knowledge: Strong overall and gets easy items right, but still reverses conditionals.
  adaptive_behavior: 'Not be fooled by early streaks: probe and fix the hidden error
    before moving on.'
scenarios:
